<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'">
<title>Opening application</title>
<link rel="stylesheet" href="update-status.css">
<style>
body{margin:0;background:#fcf7f4;color:#342649;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{text-align:center;padding:24px 24px 110px}video,.still{width:180px;height:180px;object-fit:contain;mix-blend-mode:multiply}video[hidden],.still[hidden]{display:none}body[data-app="terrier"]:not(.reduced-motion) .still{display:none}h1{font-size:32px;font-weight:650;margin:0 0 12px}p{color:#75687d;margin:0}.detail{min-height:1.4em;max-width:440px;margin:10px auto 0;font-size:14px}.track{width:160px;height:3px;background:#ece2e7;margin:28px auto;overflow:hidden;border-radius:2px}.bar{height:100%;width:40%;background:#aa7c39;animation:loading 1.3s ease-in-out infinite alternate}@keyframes loading{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){video{display:none}.still:not([hidden]){display:inline-block!important}.bar{animation:none;width:100%}}
</style>
</head>
<body>
<main role="status" aria-live="polite">
<video id="loading-video" muted loop playsinline hidden aria-hidden="true"></video>
<img id="loading-icon" class="still" alt="" hidden>
<h1 id="loading-name">Opening your workspace</h1><p>Preparing the application</p>
<div class="track" aria-hidden="true"><div class="bar"></div></div><p class="detail" id="detail"></p>
</main>
<aside id="desktop-update-status" class="desktop-update loading-update" aria-label="Application updates" data-state="waiting">
<span id="desktop-installed-version" class="desktop-installed-version">Installed application</span>
<p id="desktop-update-message" class="desktop-update-message" role="status" aria-live="polite">GitHub updates: waiting to check.</p>
</aside>
<script src="update-status-ui.js"></script><script src="loading.js"></script>
</body></html>
