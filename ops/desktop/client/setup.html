<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Application settings</title><link rel="stylesheet" href="desktop-chrome.css"><link rel="stylesheet" href="setup.css"><link rel="stylesheet" href="update-status.css"></head><body><main>
