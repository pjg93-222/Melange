<section id="view-insights" role="tabpanel" aria-labelledby="tab-insights" hidden>
  <div class="insights-heading analysis-intro">
    <p class="insights-subtitle">Compare periods and explain observed changes.</p>
    <div class="insights-export analysis-page-actions page-actions"><button id="insights-page-sources" type="button" class="secondary" aria-controls="insights-sources" aria-expanded="false">Sources</button><details id="insights-export-menu" class="insights-export-menu"><summary class="secondary">Export</summary><div class="insights-export-list" role="group" aria-label="Export"><button id="insights-export-csv" class="secondary" type="button" aria-label="Export CSV" disabled>CSV</button><button id="insights-export-json" class="secondary" type="button" aria-label="Export JSON" disabled>JSON</button></div></details><button id="insights-refresh" type="submit" form="insights-controls" class="primary">Refresh</button></div>
  </div>
  <form id="insights-controls" class="card insights-controls" aria-label="Insights scope">
    <div class="insights-filter-grid">
      <label class="insights-field">Industry<select id="insights-dataset" aria-label="Insights industry"><option value="">Loading industries…</option></select></label>
      <label class="insights-field">Company<select id="insights-company"><option value="">All covered companies</option></select></label>
      <label class="insights-field">Basis<select id="insights-basis"><option value="receipt">Reported receipts</option><option value="original_observed">Observed original giving</option><option value="original_supported">Supported original giving</option><option value="pac_activity">PAC activity</option></select></label>
      <label class="insights-field">Funding<select id="insights-funding-source"><option value="">All reported sources</option></select></label>
    </div>
    <div class="insights-periods" role="group" aria-label="Periods compared">
      <label class="chip-select insights-period" for="insights-baseline-cycle"><span class="insights-visually-hidden">Compare from</span><span class="insights-period-text" aria-hidden="true">Automatic</span><select id="insights-baseline-cycle"><option value="">Automatic</option></select></label>
      <span class="insights-period-arrow" aria-hidden="true">&#8594;</span>
      <label class="chip-select insights-period" for="insights-current-cycle"><span class="insights-visually-hidden">Compare to</span><span class="insights-period-text" aria-hidden="true">Automatic</span><select id="insights-current-cycle"><option value="">Automatic</option></select></label>
      <button id="insights-swap-periods" type="button" class="icon-button insights-swap" aria-label="Swap periods" title="Swap periods"><svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 7.5h11.5M12.5 4.5l3 3-3 3M16 12.5H4.5M7.5 9.5l-3 3 3 3"/></svg></button>
      <button id="insights-more-options" type="button" class="icon-button insights-more" aria-label="More options" title="More options" aria-expanded="false" aria-controls="insights-options"><svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="4.5" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/></svg></button>
    </div>
    <div id="insights-options" class="insights-comparison-options" hidden>
      <label class="insights-field">Contributions through<input id="insights-as-of" type="date" title="Include contribution dates up to this day. Blank uses today."></label>
      <label class="insights-field">Compare industry<select id="insights-comparison-dataset"><option value="">No industry comparison</option></select></label>
    </div>
  </form>
  <section id="insights-summary" class="card insights-summary" aria-label="Period summary"><dl>
    <div><dt id="insights-summary-left-label">Net giving</dt><dd id="insights-summary-left">—</dd></div>
    <div><dt id="insights-summary-right-label">Net giving</dt><dd id="insights-summary-right">—</dd></div>
    <div><dt>Change</dt><dd id="insights-summary-change">—</dd></div>
    <div><dt>Recipients</dt><dd id="insights-summary-recipients">—</dd></div>
  </dl></section>
  <div id="insights-status" class="insights-status insights-visually-hidden" role="status" aria-live="polite">Open Insights to load available industries.</div>
  <div class="insights-layout">
    <section id="insights-analyses" class="card insights-rail" aria-labelledby="insights-rail-title">
      <h2 id="insights-rail-title" class="card-title insights-rail-title">Analyses</h2>
      <div id="insights-toggles" class="insights-toggles" role="group" aria-labelledby="insights-rail-title"></div>
      <p id="insights-preference-note" class="insights-preference-note" hidden></p>
      <div class="insights-rail-footer"><button id="insights-core-only" type="button" class="insights-text-button">Core three</button><span class="insights-rail-divider" aria-hidden="true"></span><button id="insights-enable-all" type="button" class="insights-text-button">All</button></div>
    </section>
    <div class="insights-main">
      <section id="insights-results" class="insights-results insights-analysis-view" aria-label="Analysis cards" aria-busy="false"></section>
      <section id="insights-sources" class="card insights-sources insights-analysis-view" aria-labelledby="insights-sources-title" tabindex="-1" hidden>
        <div class="insights-panel-heading"><h3 id="insights-sources-title" class="card-title">Contributing records</h3><button id="insights-sources-close" class="secondary" type="button">Back to analyses</button></div>
        <div id="insights-scope" class="insights-scope" hidden></div>
        <p id="insights-sources-status" role="status" aria-live="polite"></p>
        <div id="insights-sources-table"></div>
        <div class="insights-source-actions"><button id="insights-sources-prev" class="secondary" type="button">Previous page</button><button id="insights-sources-next" class="secondary" type="button">Next page</button><button id="insights-sources-retry" class="secondary" type="button" hidden>Retry records</button></div>
      </section>
    </div>
  </div>
</section>
